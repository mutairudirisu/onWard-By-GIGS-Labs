<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6ef">
    <title>Connection break — onWard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Comfortaa, "Trebuchet MS", system-ui, sans-serif;
        color: #25271e;
        background: #f5f6ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding:
          max(20px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(201, 242, 78, 0.18), transparent 50%),
          #f5f6ef;
      }

      main {
        width: min(100%, 480px);
        padding: clamp(28px, 7vw, 48px);
        border: 1px solid #e7e9df;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(37, 39, 30, 0.08);
        text-align: center;
      }

      .wordmark {
        margin: 0 0 28px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.07em;
      }

      .wordmark span {
        color: #86b51b;
      }

      .signal {
        position: relative;
        display: grid;
        width: 112px;
        height: 112px;
        margin: 0 auto 26px;
        place-items: center;
        border-radius: 36px;
        background: #edf5d6;
      }

      .signal::before,
      .signal::after {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #c9f24e;
        content: "";
      }

      .signal::before {
        top: 17px;
        right: 18px;
      }

      .signal::after {
        bottom: 20px;
        left: 18px;
        width: 6px;
        height: 6px;
        background: #a7cf37;
      }

      .signal svg {
        width: 62px;
        height: 62px;
        color: #52642c;
        animation: wander 3.2s ease-in-out infinite;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #71803e;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 380px;
        margin: 0 auto;
        font-size: clamp(28px, 7vw, 38px);
        line-height: 1.16;
        letter-spacing: -0.065em;
      }

      .description {
        max-width: 350px;
        margin: 16px auto 0;
        color: #696c61;
        font-size: 14px;
        line-height: 1.75;
      }

      button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-top: 26px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #c9f24e;
        color: #25271e;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        background: #b9e33c;
      }

      button:focus-visible {
        outline: 3px solid #647c27;
        outline-offset: 3px;
      }

      button svg {
        width: 16px;
        height: 16px;
      }

      .status {
        min-height: 18px;
        margin: 17px 0 0;
        color: #85877d;
        font-size: 10px;
        line-height: 1.5;
      }

      @keyframes wander {
        0%, 100% { transform: translate(0, 0) rotate(-4deg); }
        50% { transform: translate(0, -5px) rotate(4deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark"><span>o</span>nWard</p>
      <div class="signal" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M12 24a30 30 0 0 1 40 0M20 33a18 18 0 0 1 24 0M28 42a7 7 0 0 1 8 0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="m13 13 38 38" stroke="#9bbd39" stroke-width="5" stroke-linecap="round"/>
          <circle cx="32" cy="51" r="3" fill="currentColor"/>
        </svg>
      </div>
      <p class="eyebrow">A tiny connection break</p>
      <h1>Your internet went for a walk.</h1>
      <p class="description">
        onWard needs a connection to load this page. Reconnect to Wi-Fi or mobile data,
        and we’ll pick up when your internet gets back from its adventure.
      </p>
      <button type="button" id="retry">
        Try again
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 7v5h-5M4.5 16a8 8 0 0 0 13.2 2.1L20 15M4 17v-5h5m10.5-4A8 8 0 0 0 6.3 5.9L4 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="status" id="connection-status" role="status" aria-live="polite">
        We’ll be right here when the signal returns.
      </p>
    </main>
    <script>
      const status = document.getElementById("connection-status");
      const retry = document.getElementById("retry");

      retry.addEventListener("click", () => {
        status.textContent = "Checking for a signal…";
        window.location.reload();
      });

      window.addEventListener("online", () => {
        status.textContent = "You’re back online. Opening onWard…";
        window.setTimeout(() => window.location.reload(), 400);
      });

      window.addEventListener("offline", () => {
        status.textContent = "Still offline. Your internet is taking the scenic route.";
      });
    </script>
  </body>
</html>
